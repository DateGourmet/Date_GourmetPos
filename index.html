<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Date Gourmet POS</title>

<link rel="stylesheet" href="css/style.css">
</head>

<body>

<h1>🍽️ Date Gourmet POS</h1>

<h2>Sistema de Ventas</h2>

<p> Bienvenido al sistema de punto de venta de Date Gourmet.</p>
<div>
<button>🧾 Nueva Venta</button>
<button>📦 Productos</button>
<button>📊 Inventario</button>
<button>💰 Caja</button>
</div>
  <h2>Productos</h2>

<table border="1" style="margin:auto;">
<tr>
<th>Producto</th>
<th>Precio</th>
</tr>

<tr>
<td>Empanada</td>
<td>$0.60</td>
</tr>

<tr>
<td>Chicha</td>
<td>$1.00</td>
</tr>

<tr>
<td>Tequeño</td>
<td>$0.50</td>
</tr>
</table>
  <h2>Nueva Venta</h2>

<p>Producto:</p>

<select>
<option>Empanada - $0.60</option>
<option>Chicha - $1.00</option>
<option>Tequeño - $0.50</option>
</select>

<p>Cantidad:</p>

<input type="number" value="1">

<br><br>

<button>Agregar al pedido</button>

<h3>Total: $0.00</h3>
<p>Próximamente estará disponible.</p>

<script src="js/app.js"></script>

</body>

</html>
